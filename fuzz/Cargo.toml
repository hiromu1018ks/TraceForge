[package]
name = "tf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# cargo-fuzz が本 crate を fuzz package として認識するための印。
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# tf-core・tf-parsers の関数を fuzz 対象とする。
# Phase 1 で core を、Phase 4 共通検証（T4-092）で parsers を追加した。
# Phase 5 共通編（T5-001）で engines を追加した。
tf-core = { path = "../crates/core" }
tf-engines = { path = "../crates/engines" }
tf-parsers = { path = "../crates/parsers" }
tempfile = "3"

# cargo-fuzz 雛形 target（T0-010、F-025、製品 §13.1）。
# Phase 1 以降で core の各関数（決定的 ID・Windows path・canonical JSON 等）の
# fuzz target を追加する。
[[bin]]
name = "core"
path = "fuzz_targets/core.rs"
test = false
doc = false

# Phase 4 共通検証（T4-092）: 全 Parser（7種）の fuzz target。
# 各 Parser へ raw bytes を投げ、破損入力で panic しないことを継続的 fuzzing で
# 検証可能にする（F-025）。run_parser_catching_panic で Parser 内の panic を捕捉する。
[[bin]]
name = "lnk"
path = "fuzz_targets/lnk.rs"
test = false
doc = false

[[bin]]
name = "prefetch"
path = "fuzz_targets/prefetch.rs"
test = false
doc = false

[[bin]]
name = "usn"
path = "fuzz_targets/usn.rs"
test = false
doc = false

[[bin]]
name = "evtx"
path = "fuzz_targets/evtx.rs"
test = false
doc = false

[[bin]]
name = "registry"
path = "fuzz_targets/registry.rs"
test = false
doc = false

[[bin]]
name = "amcache"
path = "fuzz_targets/amcache.rs"
test = false
doc = false

[[bin]]
name = "jump_lists"
path = "fuzz_targets/jump_lists.rs"
test = false
doc = false

# Phase 5 共通編（T5-001）: Rule loader の fuzz target。
# 破損 raw bytes・境界値 size 入力でも panic しないことを継続的 fuzzing で検証する。
[[bin]]
name = "rule_loader"
path = "fuzz_targets/rule_loader.rs"
test = false
doc = false

# Phase 5 Sigma 編（T5-010〜T5-017）: Sigma evaluator の fuzz target。
# 破損 YAML・不正 Sigma 構文入力でも panic しないことを継続的 fuzzing で検証する。
[[bin]]
name = "sigma"
path = "fuzz_targets/sigma.rs"
test = false
doc = false

# Phase 5 YARA-X 編（T5-020〜T5-027）: YARA-X compiler/scanner の fuzz target。
# 破損 YARA・不正構文・巨大入力でも panic しないことを継続的 fuzzing で検証する。
[[bin]]
name = "yara_x"
path = "fuzz_targets/yara_x.rs"
test = false
doc = false

# 親 workspace から独立した fuzz 専用 workspace とする。
# cargo-fuzz は libfuzzer-sys を用い、fuzz target のビルド要件が
# メイン workspace と異なるため、fmt/clippy/test/doc の対象から切り離す。
[workspace]
