# cargo-deny 設定（T0-004、互換性仕様書 §11: license・security advisory チェック）
#
# 実行: cargo deny check
# CI の deny job で advisories・licenses・bans・sources を検証する。
# TraceForge は依存 pin と再現性を保証するため、全 release で本チェックを通す（互換 §11）。

[graph]
all-features = true

[advisories]
# RustSec セキュリティ advisory データベース。
db-urls = ["https://github.com/rustsec/advisory-db"]
# yanked crate は再現性を損なうため拒否する。
yanked = "deny"
# unmaintained（開発停止）advisory は workspace 直依存のみ error とする。
# yara-x が間接依存する bincode 等の「メンテナンス停止」は本プロジェクトの
# 脅威モデルへ直接影響しないため、transitive な停止報告は警告に留める。
unmaintained = "workspace"
# Phase 5 YARA-X 編（T5-020）で導入した yara-x v1.19.0 の間接依存に起因する
# advisory のうち、本プロジェクトの脅威モデル（offline forensic tool・外部通信なし・
# 信頼できない Rule は読込前に compile error 処理）へ影響しないものを明示的に例外とする。
# 各理由は advisory ID 毎に記載し、新 version の yara-x で解消されたら除外する。
ignore = [
    # rsa 0.9.10: Marvin Attack（timing side-channel）。network 越しの観察が必要。
    # TraceForge は offline forensic tool であり、rsa は yara-x の pe/macho/dotnet
    # module 経由で署名検証に使われるのみ。network exposure はない。
    # 上位の yara-x が修正版 rsa へ依存するまで例外とする。
    { id = "RUSTSEC-2023-0071", reason = "offline forensic tool では network timing 観測不可。yara-x v1.19.0 が間接依存（pe/macho/dotnet module の署名検証用）。yara-x の更新で解消予定" },
    # wasmtime 43.0.2: type indices mixing（複数 engine 間の型混同）。
    # yara-x は単一の内部 engine で YARA rule 条件をコンパイル・実行するため、
    # 複数 engine 間の型混同は発生しない。yara-x v1.19.0 は wasmtime = "43.0.2"
    # へ hard-pin しており、本プロジェクトから独立に update できない。
    # yara-x が wasmtime >= 47.0.3 へ移行したら解消される。
    { id = "RUSTSEC-2026-0222", reason = "yara-x 内部の単一 engine 使用のみ。yara-x v1.19.0 が wasmtime 43.0.2 へ hard-pin しており個別 update 不可" },
]

[licenses]
# publish=false の自作 crate（tf-*）は license チェック対象外。
# TraceForge 自体の license は別途決定するまで各 crate へ宣言しない。
private = { ignore = true }
# 外部依存 crate に許可する license。
# copyleft（GPL 等）は配布形態へ影響するため、既定で拒否する（互換 §11）。
# 次のライセンスは寛容な license のみ許可する。一部 license は
# 将来の依存追加（YARA-X・Sigma 等）へ備えて先に含めており、未使用の場合は
# cargo-deny が license-not-encountered 警告を出す（エラーではない）。
allow = [
    "MIT",
    # MIT No Attribution（jsonschema 依存の borrow-or-share 等）。attribution 義務のない MIT 互換。
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# 重複依存（multiple-versions）は警告レベルで運用し、Phase 1 以降で厳格化する。
multiple-versions = "warn"
# crate 名のワイルドカード指定（path 依存以外の "*"）は禁止。
wildcards = "deny"

[sources]
# crates.io 以外の registry・git 依存を禁止する（再現性と供給連鎖安全）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
