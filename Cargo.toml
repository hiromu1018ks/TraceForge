# TraceForge ルート workspace 定義
#
# 8 crate 構成（roadmap §5 Phase 0 の crate 分割案）:
#   core      - データモデル・決定的 ID・時刻・Windows path・Schema（Phase 1）
#   evidence  - discovery・snapshot・SHA-256・Artifact 識別（Phase 2）
#   store     - Event Store・決定的 iteration・Timeline（Phase 3）
#   parsers   - 7 種 Parser と framework（Phase 4）
#   engines   - Sigma・YARA-X・Correlation 検知（Phase 5）
#   findings  - Finding 統合・ATT&CK mapping（Phase 6）
#   export    - 6 出力形式（Phase 7）
#   cli       - 9 command エントリポイント（Phase 7）
#
# Phase 0 では各 crate を空実装で作成し、CI（fmt/clippy/test/doc）が通ることを確認する。

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/evidence",
    "crates/store",
    "crates/parsers",
    "crates/engines",
    "crates/findings",
    "crates/export",
    "crates/cli",
]

# workspace 共通の package metadata。各 crate は `.workspace = true` で継承する。
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["TraceForge Contributors"]
repository = "https://github.com/hiromu1018ks/TraceForge"
description = "Windows Forensic Timeline & Evidence Correlation Engine"
publish = false

# TraceForge 自体の license は別途決定するまで各 crate へ license 宣言を行わない。
# 依存 crate の license は deny.toml（cargo-deny）で許可リストを運用する。

# 共通 lint 設定。各 crate は [lints] workspace = true で継承する。
# TraceForge は安全性・決定性を重視するため、clippy の全 lint を warning 扱いで有効化。
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# 共通依存。各 crate は `dep.workspace = true` で継承する。
# version は Cargo.lock へ pin され、cargo-deny で再現性と供給連鎖安全を担保する（互換 §11）。
# RustCrypto / serde / chrono / toml 系は全て MIT または Apache-2.0（deny.toml の許可リスト内）。
[workspace.dependencies]
# 決定的 ID・digest（規範 §12、Schema §2.1）
sha2 = "0.10"
hex = "0.4"
# canonical JSON・Schema 検証・Case JSON 読み書き（Schema §2.1、§5、§9）
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# default-features を切り、Draft 2020-12（Schema §4・§7 が使用）だけを有効化する。
# 外部 file 参照（resolve-file）・HTTP 参照（reqwest）・CLI は使用しない。
jsonschema = { version = "0.23", default-features = false, features = ["draft202012"] }
# 時刻モデル（規範 §6、Schema §4）。chrono は DateTime<Utc> と NaiveDateTime を提供。
# clock feature はテスト等の現在時刻参照用。std 以外の default feature は除外する。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# IANA timezone と DST 処理（規範 §6.2、Schema §8.3）
chrono-tz = "0.10"
# TOML 設定 load（Schema §8）
toml = "0.8"
# Error 型の derive（規範 §17）
thiserror = "1"
# property test（T1-008、T1-016、T1-032 等）
proptest = "1"
# Unicode NFC 正規化（T2-001、規範 §5.2: source_locator の NFC 正規化）
unicode-normalization = "0.1"
# YARA-X ファイルパターン scan（Phase 5 YARA-X 編 T5-020、互換 §7）
# default features（default-modules 含む）を有効化し、一般的な forensic YARA Rule との互換性を確保する。
# version は Cargo.lock へ pin され、cargo-deny で再現性と供給連鎖安全を担保する（互換 §7・§11）。
# `latest` 使用禁止（互換 §7）・固定 version を Manifest へ記録する。
yara-x = "1.19"
# 正規表現 matcher（Phase 5 Correlation 編 T5-033・Schema §7 `regex` operator 用）。
# default features のみ（unicode 一貫性・最適化済み dfa）。Cargo.lock へ pin され、
# cargo-deny で再現性と供給連鎖安全を担保する。yara-x から間接依存しているため
# workspace へ明示的に追加しても新規の multiple-versions は発生しない。
regex = "1"
